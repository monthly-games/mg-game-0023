name: game
description: "Colony Frontier Game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  google_mobile_ads: ^7.0.0
  flutter:
    sdk: flutter
  flame: ^1.13.0
  flame_spine: ^0.3.0+1
  flame_audio: ^2.0.0
  get_it: ^9.2.0
  equatable: ^2.0.5
  mg_common_game:
    path: ../libs/mg_common_game
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.5.4
  uuid: ^4.0.0
  firebase_analytics: ^12.2.0
  firebase_messaging: ^16.1.3

  firebase_core: ^4.6.0
  firebase_remote_config: ^6.3.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/spine/characters/
